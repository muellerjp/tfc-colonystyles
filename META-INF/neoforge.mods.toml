# tools/pack.py fills in mod_version, minecraft_version and neo_version_range when it builds the jar.
# "lowcodefml" is the loader for mods without Java code (javafml needs an @Mod class).
modLoader = "lowcodefml"
loaderVersion = "[4,)"
license = "All Rights Reserved"
issueTrackerURL = "https://github.com/muellerjp/tfc-colonystyles/issues"

[[mods]]
    # Mod IDs must be lowercase: ^[a-z][a-z0-9_]{1,63}$
    modId = "tfccolonystyles"
    version = "${mod_version}"
    displayName = "TFC Colony Styles"
    credits="Thanks to LDTTeam for Minecolonies"
    authors = "Mr101Freaking"
    displayURL = "https://www.curseforge.com/minecraft/mc-mods/tfc-colonystyles"
    displayTest="IGNORE_SERVER_VERSION"
    logoFile = "logo.png"
    description = "A collection of TFC-ready colony styles."

[[dependencies.tfccolonystyles]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.tfccolonystyles]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.tfccolonystyles]]
    modId = "structurize"
    type = "required"
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.tfccolonystyles]]
    modId = "minecolonies"
    type = "required"
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.tfccolonystyles]]
    modId = "tfc"
    type = "required"
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.tfccolonystyles]]
    modId = "mcwroofs"
    type = "required"
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"
