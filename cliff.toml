# git-cliff config: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this structure pack are documented here.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^docs", group = "<!-- 2 -->Documentation" },
  { message = "^(ci|build|chore|refactor|style)", group = "<!-- 3 -->Maintenance" },
  { message = ".*", group = "<!-- 4 -->Other" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
